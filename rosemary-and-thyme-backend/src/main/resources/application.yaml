spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: rosemary-and-thyme-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,email,profile

cloudinary:
  cloud-name: ${CLOUDINARY_NAME}
  api-key: ${CLOUDINARY_KEY}
  api-secret: ${CLOUDINARY_SECRET}

resend:
  api-key: ${RESEND_API_KEY}
  from: ${RESEND_FROM_EMAIL}

app:
  # used to build the verification link sent in the email
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # domain the session cookie is scoped to, so it's shared between api.<domain> and <domain>;
  # defaults to localhost so cookies still work for local dev
  cookie-domain: ${COOKIE_DOMAIN:localhost}





ktor:
  deployment:
    port: 8080
  application:
    modules:
      - rosemary_and_thyme.modules.ApplicationModulesKt.modules

frontend:
  url: "${FRONTEND_URL}"

resend:
  apiKey: "${RESEND_API_KEY}"
  from: "${RESEND_FROM}"

database:
  url: "${DB_URL:jdbc:postgresql://localhost:5432/rosemary_and_thyme}"
  user: "${DB_USER:user}"
  password: "${DB_PASSWORD:password}"

s3Client:
  accountId: "${S3_ACCOUNT_ID}"
  accessKeyId: "${S3_ACCESS_KEY_ID}"
  secretAccessKey: "${S3_SECRET_ACCESS_KEY}"
  bucket: "${S3_BUCKET}"
jwt:
  publicKey: "${PUBLIC_KEY}"
  privateKey: "${PRIVATE_KEY}"

google:
  clientId: "${CLIENT_ID}"
  clientSecret: "${CLIENT_SECRET}"

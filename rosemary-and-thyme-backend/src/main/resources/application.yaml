ktor:
  deployment:
    port: 8080
  application:
    modules:
      - rosemary_and_thyme.modules.ApplicationModulesKt.modules

database:
  url: "${DB_URL:jdbc:postgresql://localhost:5432/rosemary_and_thyme}"
  user: "${DB_USER:user}"
  password: "${DB_PASSWORD:password}"

s3Client:
  accountId: "${S3_ACCOUNT_ID}"
  accessKeyId: "${S3_ACCESS_KEY_ID}"
  secretAccessKey: "${S3_SECRET_ACCESS_KEY}"
  bucket: "${S3_BUCKET}"

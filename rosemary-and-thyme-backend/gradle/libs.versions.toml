[versions]
kotlin = "2.4.0"
logback = "1.5.37"
jooq = "3.21.9"
postgresql = "42.7.14"
hikari = "7.1.0"
spring-security = "7.1.1"
password4j = "1.8.4"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-kotlin = { module = "org.jooq:jooq-kotlin", version.ref = "jooq" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
spring-security-crypto = { module = "org.springframework.security:spring-security-crypto",version.ref="spring-security" }
password4j = { module = "com.password4j:password4j", version.ref = "password4j" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization={id="org.jetbrains.kotlin.plugin.serialization",version.ref="kotlin"}
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
